<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- End Required meta tags -->
    <!-- Begin SEO tag -->
    <title> Sign In | ESU </title>
    <meta property="og:title" content="Sign In">
    <meta name="author" content="Beni Arisandi">
    <meta property="og:locale" content="en_US">
    <meta name="description" content="Responsive admin theme build on top of Bootstrap 4">
    <meta property="og:description" content="Responsive admin theme build on top of Bootstrap 4">
    <link rel="canonical" href="index.html">
    <meta property="og:url" content="index.html">
    <meta property="og:site_name" content="Looper - Bootstrap 4 Admin Theme">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="144x144" href="/frontend/src/assets/apple-touch-icon.png">
    <link rel="shortcut icon" href="/frontend/src/assets/favicon.ico">
    <meta name="theme-color" content="#3063A0"><!-- Google font -->
    <link href="https://fonts.googleapis.com/css?family=Fira+Sans:400,500,600" rel="stylesheet"><!-- End Google font -->
    <!-- BEGIN PLUGINS STYLES -->
    <link rel="stylesheet" href="/frontend/src/assets/vendor/%40fortawesome/fontawesome-free/css/all.min.css">
    <!-- END PLUGINS STYLES -->
    <!-- BEGIN THEME STYLES -->
    <link rel="stylesheet" href="/frontend/src/assets/stylesheets/theme.min.css" data-skin="default">
    <link rel="stylesheet" href="/frontend/src/assets/stylesheets/theme-dark.min.css" data-skin="dark">
    <link rel="stylesheet" href="/frontend/src/assets/stylesheets/custom.css">
    <link rel="stylesheet" href="/frontend/src/assets/stylesheets/style.css">
    <script>
        var skin = localStorage.getItem('skin') || 'default';
        var disabledSkinStylesheet = document.querySelector('link[data-skin]:not([data-skin="' + skin + '"])');
        // Disable unused skin immediately
        disabledSkinStylesheet.setAttribute('rel', '');
        disabledSkinStylesheet.setAttribute('disabled', true);
        // add loading class to html immediately
        document.querySelector('html').classList.add('loading');
    </script><!-- END THEME STYLES -->
</head>

<body>

    <main class="auth">
        <header id="auth-header" class="auth-header"
            style="background-image: url(/assets/images/illustration/img-1.png);">
            <h1 style="display: flex; flex-direction: column;">
                <span>Enseignement Supérieur et Universitaire</span>
                <a href="/frontend/index.html" style="text-decoration: none; color: white;">ESU</a>
            </h1>
            <p>
                Avez vous un compte? <a href="/frontend/views/auth/register.html">S'incrire</a>
            </p>
        </header>

        <form class="auth-form">

            <div class="form-group">
                <div class="form-label-group">
                    <input type="text" id="inputUser" class="form-control" placeholder="Username" autofocus=""> <label
                        for="inputUser">johndoe@gmail.com</label>
                </div>
            </div>
            <div class="form-group">
                <div class="form-label-group">
                    <input type="password" id="inputPassword" class="form-control" placeholder="Password"> <label
                        for="inputPassword">Mot de passe</label>
                </div>
            </div>
            <div class="form-group">
                <button class="btn btn-lg btn-primary btn-block" type="submit">Se connecter</button>
            </div>
            <div class="form-group">
                <div class="custom-control custom-control-inline custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="remember-me"> <label
                        class="custom-control-label" for="remember-me">Mémoriser</label>
                </div>
            </div>
            <div class="text-end  pt-3">
                <a href="/frontend/views/auth/forget-pwd.html" class="link">Mot de passe oublié?</a>
            </div>
        </form>

        <footer class="auth-footer">© 2025 Beyin LazQuir.</footer>
    </main>
    <!-- BEGIN BASE JS -->
    <script src="/frontend/src/assets/vendor/jquery/jquery.min.js"></script>
    <script src="/frontend/src/assets/vendor/popper.js/umd/popper.min.js"></script>
    <script src="/frontend/src/assets/vendor/bootstrap/js/bootstrap.min.js"></script> <!-- END BASE JS -->
    <!-- BEGIN PLUGINS JS -->
    <script src="/frontend/src/assets/vendor/particles.js/particles.js"></script>
    <script>

        $(document).on('theme:init', () => {
            /* particlesJS.load(@dom-id, @path-json, @callback (optional)); */
            particlesJS.load('auth-header', '/assets/javascript/pages/particles.json');
        })
    </script> <!-- END PLUGINS JS -->
    <!-- BEGIN THEME JS -->
    <script src="/frontend/src/assets/javascript/theme.js"></script> <!-- END THEME JS -->
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-116692175-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'UA-116692175-1');
    </script>
</body>

</html>
